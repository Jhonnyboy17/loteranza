<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0B0810" />
    <meta name="color-scheme" content="dark" />
    <title>Jackpot USA — Jackpots e resultados das loterias americanas</title>
    <meta
      name="description"
      content="Acompanhe jackpots e resultados das principais loterias dos Estados Unidos, monte seus jogos e confira seus números. Serviço em português."
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!--
      Fontes carregadas sem bloquear a renderização: se a CDN estiver lenta ou
      inacessível, a página aparece imediatamente com a pilha de fontes do
      sistema (definida em tailwind.config.ts) em vez de ficar em branco.
    -->
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Sora:wght@600;700;800&display=swap"
      onload="this.onload=null;this.rel='stylesheet'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Sora:wght@600;700;800&display=swap"
      />
    </noscript>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
