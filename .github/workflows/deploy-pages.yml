# Publica o protótipo no GitHub Pages a cada push no branch de trabalho.
#
# O que este deploy é: a interface lendo do Supabase real, com os três portões
# de transação fechados. Nenhuma compra é processada e nenhum pagamento é
# cobrado — não por falta de código, mas porque o Compliance Engine recusa:
# kill switch global desligado e nenhuma jurisdição habilitada.
#
# Se as variáveis VITE_SUPABASE_* não estiverem definidas no repositório, o
# build não quebra: cai no provider de demonstração e o resumo do run diz
# como apontar para o banco. Ver docs/DEPLOY.md.
name: Publicar protótipo (GitHub Pages)

on:
  push:
    branches: [claude/us-lottery-platform-compliance-odaruu]
  workflow_dispatch:

# Permissões mínimas para o deploy oficial do Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# Um deploy por vez; não cancela o que já está no ar no meio do caminho.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # Os mesmos portões que rodam localmente, antes de publicar qualquer coisa.
      - name: Verificar tipos
        run: npm run typecheck

      - name: Verificar lint
        run: npm run lint

      # As variáveis do repositório têm prioridade, mas são conferidas antes de
      # entrar no build. Uma chave colada com quebra de linha ou truncada é o
      # erro mais fácil de cometer nessa tela, e o sintoma é cruel: o app entra
      # em modo Supabase, as requisições são recusadas e a tela fica girando —
      # parece falta de dado, mas é credencial inválida. Formato errado aqui
      # vale o mesmo que variável ausente, e o build usa o valor conhecido.
      #
      # A chave anon é pública por desenho: é ela que o navegador apresenta, e
      # quem protege os dados é o RLS — ativado E forçado nas 38 tabelas, com
      # 73 policies. A service role key nunca chega aqui; operação privilegiada
      # passa por Edge Function.
      - name: Resolver credenciais do Supabase
        env:
          VAR_URL: ${{ vars.VITE_SUPABASE_URL }}
          VAR_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
        run: |
          PADRAO_URL='https://pymgliyofizgfirekepg.supabase.co'
          PADRAO_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InB5bWdsaXlvZml6Z2ZpcmVrZXBnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTA5MDExOTIsImV4cCI6MjEwNjQ3NzE5Mn0.rI-jOw1jMC4QgomucPKs8s2gVhpTOzJJQxi5JZF9iL8'

          # tr -d remove espaço e quebra de linha: é exatamente o que uma
          # colagem torta deixa para trás.
          URL=$(printf '%s' "$VAR_URL" | tr -d '[:space:]')
          KEY=$(printf '%s' "$VAR_KEY" | tr -d '[:space:]')

          ORIGEM_URL='variável do repositório'
          ORIGEM_KEY='variável do repositório'

          case "$URL" in
            https://*.supabase.co) ;;
            *) URL="$PADRAO_URL"; ORIGEM_URL='valor padrão (variável ausente ou inválida)' ;;
          esac

          # JWT tem três segmentos base64url separados por ponto. Trunque a
          # chave e ela deixa de casar.
          if ! printf '%s' "$KEY" | grep -Eq '^[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+$'; then
            KEY="$PADRAO_KEY"
            ORIGEM_KEY='valor padrão (variável ausente ou inválida)'
          fi

          {
            echo "VITE_SUPABASE_URL=$URL"
            echo "VITE_SUPABASE_ANON_KEY=$KEY"
            echo "ORIGEM_URL=$ORIGEM_URL"
            echo "ORIGEM_KEY=$ORIGEM_KEY"
          } >> "$GITHUB_ENV"

      - name: Construir
        env:
          # Pages de projeto serve em https://<user>.github.io/<repo>/
          VITE_BASE: /${{ github.event.repository.name }}/
          # Sem servidor que reescreva rotas: o app usa rotas com "#", que
          # funcionam em qualquer host estático.
          VITE_ROUTER: hash
          # Protótipo não deve aparecer em busca: marca provisória e textos
          # legais ainda pendentes de validação jurídica.
          VITE_NOINDEX: 'true'
          # Portão 1 de 3, aberto por decisão do operador para habilitar a
          # venda ao Brasil. Abrir aqui NÃO vende nada sozinho: o pedido ainda
          # passa pelo kill switch global (portão 2), pela jurisdição (portão
          # 3) e pelo veredito do Compliance Engine. Este portão apenas deixa
          # a interface sair do modo demonstração.
          VITE_TRANSACTIONS_ENABLED: 'true'
          # VITE_SUPABASE_URL e VITE_SUPABASE_ANON_KEY vêm do passo anterior.
        run: npm run build

      # Grava o veredito num arquivo servido junto com o site. Log de Actions
      # expira e nem sempre é acessível; esta URL responde a qualquer momento,
      # de qualquer aparelho, e diz contra o que o site foi construído.
      - name: Registrar qual backend entrou no build
        env:
          # Precisa repetir aqui: `env` de um passo nao vaza para o proximo.
          # Era essa a causa de o arquivo dizer "false" com o build em true.
          VITE_TRANSACTIONS_ENABLED: 'true'
        run: |
          cat > dist/diagnostico.json <<JSON
          {
            "commit": "${{ github.sha }}",
            "construido_em": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "supabase_url": "$VITE_SUPABASE_URL",
            "chave_anon_tamanho": ${#VITE_SUPABASE_ANON_KEY},
            "origem_url": "$ORIGEM_URL",
            "origem_chave": "$ORIGEM_KEY",
            "portao1_interface": $VITE_TRANSACTIONS_ENABLED,
            "observacao": "portao1_interface diz apenas se a interface saiu do modo demonstracao. A venda ainda depende do kill switch global, da jurisdicao e do veredito do Compliance Engine, todos no banco."
          }
          JSON
          {
            echo "### Backend deste build"
            echo
            echo "| | |"
            echo "| --- | --- |"
            echo "| URL | \`$VITE_SUPABASE_URL\` |"
            echo "| Origem da URL | $ORIGEM_URL |"
            echo "| Origem da chave | $ORIGEM_KEY |"
            echo
            echo "Confira a qualquer momento em \`/loteranza/diagnostico.json\`."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Bloquear indexação e evitar 404 em link direto
        run: |
          printf 'User-agent: *\nDisallow: /\n' > dist/robots.txt
          rm -f dist/sitemap.xml
          # O Pages devolve 404.html para caminho desconhecido; sendo cópia do
          # index, o app carrega e a rota é resolvida no cliente.
          cp dist/index.html dist/404.html
          # .nojekyll impede o Jekyll de ignorar pastas iniciadas com "_".
          touch dist/.nojekyll

      # O GITHUB_TOKEN consegue PUBLICAR no Pages, mas não consegue CRIÁ-LO:
      # criar o site exige direito de administração, que só o dono tem. Sem
      # esta checagem o job morre com "Resource not accessible by integration",
      # que não diz a ninguém o que fazer.
      - name: Conferir se o Pages está ligado
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh api "repos/${{ github.repository }}/pages" >/dev/null 2>&1; then
            echo "Pages ligado. Seguindo."
            exit 0
          fi
          {
            echo "## GitHub Pages ainda não está ligado"
            echo
            echo "O build passou inteiro; falta só ligar o Pages uma vez."
            echo
            echo "1. Abra **Settings → Pages** em:"
            echo "   https://github.com/${{ github.repository }}/settings/pages"
            echo "2. Em **Source**, escolha **GitHub Actions**."
            echo "3. Volte aqui e clique em **Re-run all jobs**."
            echo
            echo "É uma vez só. Depois disso todo push republica sozinho."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::error::Pages não está ligado. Settings → Pages → Source: GitHub Actions, e rode o workflow de novo."
          exit 1

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
